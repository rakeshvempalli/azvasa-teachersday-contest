<svg viewBox="0 0 540 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="azvasa-sphere" cx="38%" cy="32%" r="65%" fx="32%" fy="28%">
      <stop offset="0%" stop-color="#FFECB3" />
      <stop offset="30%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>

    <linearGradient id="azvasa-flame" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="35%" stop-color="#FF9800" />
      <stop offset="75%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>

    <linearGradient id="azvasa-swoosh" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00A8FF" />
      <stop offset="20%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#0050EA" />
      <stop offset="100%" stop-color="#0080FF" />
    </linearGradient>

    <linearGradient id="azvasa-underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055FE" />
      <stop offset="40%" stop-color="#0066FF" />
      <stop offset="70%" stop-color="#0099FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="sphere-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#B73E00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Golden Sun Sphere / Head -->
  <circle cx="54" cy="40" r="18" fill="url(#azvasa-sphere)" filter="url(#sphere-shadow)" />

  <!-- 2. Left Orange/Gold Flame Figure -->
  <path d="M 12 6 C 18 24 24 54 26 84 C 27 106 20 126 7 139 C 20 134 35 120 37 96 C 40 68 33 36 21 16 C 18 12 15 9 12 6 Z" fill="url(#azvasa-flame)" />

  <!-- 3. Main Royal Blue Sweeping Figure + Extended Underline Swoosh -->
  <path d="M 160 25 C 130 36 94 65 80 102 C 72 124 75 142 86 150 C 70 146 56 128 58 104 C 61 72 90 40 128 26 C 138 23 150 23 160 25 Z" fill="url(#azvasa-swoosh)" />

  <!-- Underline Swoosh -->
  <path d="M 40 88 C 36 112 48 136 78 147 C 118 162 215 162 330 152 C 405 146 470 137 520 128 C 455 137 385 144 315 147 C 190 152 102 148 68 132 C 52 124 45 108 46 92 C 44 90 41 89 40 88 Z" fill="url(#azvasa-underline)" />

  <!-- Typography -->
  <text x="138" y="96" fill="#0055FE" font-family="'Times New Roman', Times, 'Georgia', 'Playfair Display', serif" font-size="76" font-weight="800" letter-spacing="0.04em">AZVASA</text>
  <text x="142" y="134" fill="#072A52" font-family="'Times New Roman', Times, 'Georgia', 'Baskerville', serif" font-size="35" font-weight="600" letter-spacing="0.01em">Enriching Education</text>
</svg>
